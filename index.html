<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ff5fa2">
<meta name="description" content="Pinky — משחקים אונליין לכל המשפחה. משחקי ארקייד, חיות ולמידה, בחינם ובלי התקנות.">
<meta property="og:title" content="Pinky 🎀 משחקים אונליין">
<meta property="og:description" content="משחקים כיפיים לכל הגילאים — ישר מהדפדפן, בחינם.">
<title>Pinky 🎀 משחקים אונליין לכל המשפחה</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎀</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- floating background decorations -->
<div class="bg-blob b1"></div>
<div class="bg-blob b2"></div>
<div class="bg-blob b3"></div>

<header class="site-header">
  <a class="logo" href="#" aria-label="Pinky — דף הבית">
    <span class="logo-ribbon">🎀</span>
    <span class="logo-text"><b>P</b><i>i</i><b>n</b><i>k</i><b>y</b></span>
  </a>
  <p class="tagline">משחקים אונליין לכל המשפחה — בחינם, בלי התקנות 🕹️</p>
  <div class="search-wrap">
    <input id="search" type="search" placeholder="חפשו משחק… 🔍" autocomplete="off">
  </div>
</header>

<nav class="filters" aria-label="סינון משחקים">
  <div class="chip-row" id="age-chips"></div>
  <div class="chip-row" id="cat-chips"></div>
</nav>

<main>
  <section id="recent-section" class="hidden">
    <h2 class="section-title">🕘 שיחקתם לאחרונה</h2>
    <div class="grid" id="recent-grid"></div>
  </section>

  <section>
    <h2 class="section-title" id="all-title">🎮 כל המשחקים</h2>
    <div class="grid" id="games-grid"></div>
    <div id="empty" class="empty hidden">
      <div class="empty-emoji">🫧</div>
      <p>לא מצאנו משחק כזה…<br>נסו חיפוש אחר או נקו את הסינון</p>
      <button class="chip clear-btn" id="clear-filters">נקו הכל ✨</button>
    </div>
  </section>

  <section id="soon-section">
    <h2 class="section-title">🔜 בקרוב ב-Pinky</h2>
    <div class="soon-grid" id="soon-grid"></div>
  </section>
</main>

<footer class="site-footer">
  נוצר באהבה <span class="beat">💗</span> <span dir="ltr">Pinky Online Games</span> · עוד משחקים בדרך!
</footer>

<!-- fullscreen game player -->
<div id="player" class="player hidden" role="dialog" aria-modal="true">
  <div class="player-bar">
    <button id="player-close" class="pbtn close-btn">✖ חזרה</button>
    <span id="player-title" class="player-title"></span>
    <a id="player-newtab" class="pbtn" target="_blank" rel="noopener" title="פתחו בחלון מלא">⤢</a>
  </div>
  <div class="player-stage">
    <div id="player-spin" class="spinner"><span>🎮</span><p>טוען משחק…</p></div>
    <iframe id="player-frame" title="משחק" allow="fullscreen; autoplay; accelerometer; gyroscope; gamepad"></iframe>
  </div>
</div>

<script src="games.js"></script>
<script src="app.js"></script>
</body>
</html>
