<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#7b5fff">
<title>זיכרון קסום ✨</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧠</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  html,body { height:100%; }
  body {
    font-family:'Varela Round',-apple-system,sans-serif; color:#3a2340;
    background:linear-gradient(160deg,#fdeef9,#e9e4ff 55%,#dff4ff);
    display:flex; flex-direction:column; align-items:center; min-height:100vh; overflow-x:hidden;
  }

  /* ---------- screens ---------- */
  .screen { width:100%; max-width:560px; padding:22px 18px 30px; text-align:center; }
  .hidden { display:none !important; }

  h1 { font-size:clamp(30px,8vw,44px); margin:10px 0 4px; }
  .subtitle { color:#8a6f96; font-size:clamp(14px,4vw,17px); margin-bottom:26px; }
  .big-emoji { font-size:clamp(56px,16vw,84px); display:inline-block; animation:bob 2.4s ease-in-out infinite; }
  @keyframes bob { 0%,100%{transform:translateY(0) rotate(-5deg)} 50%{transform:translateY(-10px) rotate(5deg)} }

  .level-btn {
    display:flex; align-items:center; gap:14px; width:100%; margin:12px 0; padding:16px 20px;
    border:none; border-radius:20px; cursor:pointer; font:inherit; text-align:start;
    background:#fff; box-shadow:0 8px 22px rgba(123,95,255,.14);
    transition:transform .15s;
  }
  .level-btn:hover { transform:translateY(-3px); }
  .level-btn:active { transform:scale(.97); }
  .lv-emoji { font-size:34px; }
  .lv-name { font-size:19px; font-weight:700; }
  .lv-info { font-size:13.5px; color:#8a6f96; }
  .lv-best { margin-inline-start:auto; font-size:13px; color:#b18ac2; white-space:nowrap; }

  /* ---------- game header ---------- */
  .hud { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:14px; }
  .hud .stat {
    background:#fff; border-radius:16px; padding:7px 14px; font-size:15px; font-weight:700;
    box-shadow:0 4px 12px rgba(123,95,255,.12);
  }
  .back-btn {
    border:none; cursor:pointer; font:inherit; font-weight:700; font-size:14px;
    background:#fff; color:#7b5fff; padding:8px 14px; border-radius:16px;
    box-shadow:0 4px 12px rgba(123,95,255,.12);
  }

  /* ---------- board ---------- */
  .board { display:grid; gap:10px; perspective:900px; }
  .mcard { position:relative; aspect-ratio:3/3.4; cursor:pointer; }
  .inner {
    position:absolute; inset:0; transform-style:preserve-3d;
    transition:transform .45s cubic-bezier(.2,.8,.3,1.1);
  }
  .mcard.flip .inner { transform:rotateY(180deg); }
  .face {
    position:absolute; inset:0; border-radius:16px; display:grid; place-items:center;
    backface-visibility:hidden; -webkit-backface-visibility:hidden;
  }
  .face.back {
    background:linear-gradient(135deg,#ff5fa2,#7b5fff);
    box-shadow:0 5px 14px rgba(123,95,255,.25);
    color:rgba(255,255,255,.85); font-size:clamp(18px,5vw,26px);
  }
  .face.front {
    background:#fff; transform:rotateY(180deg);
    font-size:clamp(30px,9vw,52px);
    box-shadow:inset 0 0 0 3px #efe6ff, 0 5px 14px rgba(123,95,255,.18);
  }
  .mcard.matched { pointer-events:none; }
  .mcard.matched .inner { animation:matchPop .5s ease; }
  .mcard.matched .face.front { box-shadow:inset 0 0 0 3px #7CFC9A, 0 5px 14px rgba(60,200,120,.3); }
  @keyframes matchPop { 40% { transform:rotateY(180deg) scale(1.15); } 100% { transform:rotateY(180deg) scale(1); } }
  .mcard.shake .inner { animation:shakeNo .4s ease; }
  @keyframes shakeNo { 25%{transform:rotateY(180deg) translateX(-5px)} 75%{transform:rotateY(180deg) translateX(5px)} }

  /* ---------- win overlay ---------- */
  .win {
    position:fixed; inset:0; z-index:10; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(58,35,64,.55); backdrop-filter:blur(4px); padding:20px;
  }
  .win-card {
    background:#fff; border-radius:28px; padding:34px 30px; text-align:center; max-width:340px; width:100%;
    box-shadow:0 24px 60px rgba(0,0,0,.3); animation:winIn .45s cubic-bezier(.2,.8,.3,1.2);
  }
  @keyframes winIn { from { opacity:0; transform:scale(.7) translateY(30px); } }
  .win-title { font-size:30px; margin:8px 0 2px; }
  .stars { font-size:38px; letter-spacing:4px; margin:6px 0; }
  .stars .dim { filter:grayscale(1) opacity(.35); }
  .win-stats { color:#8a6f96; font-size:15px; margin-bottom:18px; }
  .win-best { color:#e63d87; font-weight:700; font-size:14px; margin-bottom:14px; }
  .btn-row { display:flex; gap:10px; justify-content:center; }
  .pbtn {
    border:none; cursor:pointer; font:inherit; font-size:16px; font-weight:700; color:#fff;
    background:linear-gradient(135deg,#ff5fa2,#7b5fff); padding:13px 22px; border-radius:18px;
    box-shadow:0 5px 0 rgba(123,95,255,.35); transition:transform .12s, box-shadow .12s;
  }
  .pbtn:active { transform:translateY(4px); box-shadow:0 1px 0 rgba(123,95,255,.35); }
  .pbtn.ghost { background:#f2ebf7; color:#7b5fff; box-shadow:0 5px 0 #ddd0ea; }

  /* confetti */
  .confetti { position:fixed; top:-14px; z-index:11; font-size:22px; pointer-events:none; animation:fall linear forwards; }
  @keyframes fall { to { transform:translateY(105vh) rotate(720deg); } }
</style>
</head>
<body>

<!-- level select -->
<div id="menu" class="screen">
  <span class="big-emoji">🧠✨</span>
  <h1>זיכרון קסום</h1>
  <p class="subtitle">הופכים קלפים, מוצאים זוגות — כמה מהר תצליחו?</p>
  <button class="level-btn" data-level="0">
    <span class="lv-emoji">🐣</span>
    <span><span class="lv-name">קל</span><br><span class="lv-info">6 קלפים · לפעוטות</span></span>
    <span class="lv-best" id="best-0"></span>
  </button>
  <button class="level-btn" data-level="1">
    <span class="lv-emoji">🌟</span>
    <span><span class="lv-name">בינוני</span><br><span class="lv-info">12 קלפים · לילדים</span></span>
    <span class="lv-best" id="best-1"></span>
  </button>
  <button class="level-btn" data-level="2">
    <span class="lv-emoji">🔥</span>
    <span><span class="lv-name">קשה</span><br><span class="lv-info">20 קלפים · לאלופים</span></span>
    <span class="lv-best" id="best-2"></span>
  </button>
</div>

<!-- game -->
<div id="game" class="screen hidden">
  <div class="hud">
    <button class="back-btn" id="back">→ תפריט</button>
    <span class="stat">🃏 <span id="moves">0</span></span>
    <span class="stat">⏱️ <span id="time">0:00</span></span>
  </div>
  <div class="board" id="board"></div>
</div>

<!-- win -->
<div id="win" class="win hidden">
  <div class="win-card">
    <span style="font-size:52px">🏆</span>
    <div class="win-title">כל הכבוד!</div>
    <div class="stars" id="stars"></div>
    <div class="win-stats"><span id="win-moves"></span> מהלכים · <span id="win-time"></span></div>
    <div class="win-best hidden" id="new-best">🎉 שיא חדש!</div>
    <div class="btn-row">
      <button class="pbtn ghost" id="win-menu">תפריט</button>
      <button class="pbtn" id="win-again">עוד פעם! 🔁</button>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';

const LEVELS = [
  { pairs: 3,  cols: 2 },
  { pairs: 6,  cols: 3 },
  { pairs: 10, cols: 4 },
];
const THEMES = [
  ['🐶','🐱','🦊','🐼','🦁','🐸','🐷','🦄','🐙','🦋'],
  ['🍕','🍩','🍓','🍦','🧁','🍉','🍪','🥑','🍭','🌮'],
  ['🚀','🌈','⭐','🪐','👽','🛸','🌙','☄️','🌍','🤖'],
  ['⚽','🏀','🎸','🎬','🎪','🎨','🎺','🎯','🎳','🪁'],
];
const BEST_KEY = 'magic_memory_best_v1';

// audio
let AC=null;
const audio=()=>{ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; };
function beep(f,d,t,v){ const ac=audio(); if(!ac) return; const o=ac.createOscillator(),g=ac.createGain();
  o.type=t||'sine'; o.frequency.value=f; g.gain.value=0; o.connect(g); g.connect(ac.destination);
  const n=ac.currentTime; g.gain.setValueAtTime(0,n); g.gain.linearRampToValueAtTime(v||.15,n+.01);
  g.gain.exponentialRampToValueAtTime(.0001,n+d); o.start(n); o.stop(n+d+.02); }
const sFlip =()=>beep(420,.07,'triangle',.1);
const sMatch=()=>{ beep(620,.1,'triangle',.16); setTimeout(()=>beep(880,.14,'triangle',.16),90); };
const sNo   =()=>beep(180,.12,'sawtooth',.08);
const sWin  =()=>{ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.16,'triangle',.16),i*110)); };

let level=0, first=null, lock=false, moves=0, matched=0, timer=null, secs=0;
let best = {};
try { best = JSON.parse(localStorage.getItem(BEST_KEY)||'{}') || {}; } catch(e){}

const $=id=>document.getElementById(id);

function fmtTime(s){ return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function showBest(){ LEVELS.forEach((_,i)=>{ const b=best[i]; $('best-'+i).textContent = b ? '🏅 '+b.moves+' מהלכים' : ''; }); }

function start(lv){
  level=lv; first=null; lock=false; moves=0; matched=0; secs=0;
  $('moves').textContent='0'; $('time').textContent='0:00';
  clearInterval(timer);
  timer=setInterval(()=>{ secs++; $('time').textContent=fmtTime(secs); },1000);

  const conf=LEVELS[lv];
  const theme=THEMES[(Math.random()*THEMES.length)|0];
  const pick=[...theme].sort(()=>Math.random()-.5).slice(0,conf.pairs);
  const deck=[...pick,...pick].sort(()=>Math.random()-.5);

  const board=$('board');
  board.style.gridTemplateColumns=`repeat(${conf.cols},1fr)`;
  board.innerHTML=deck.map((e,i)=>`
    <div class="mcard" data-v="${i}" data-e="${e}">
      <div class="inner">
        <div class="face back">✨</div>
        <div class="face front">${e}</div>
      </div>
    </div>`).join('');

  $('menu').classList.add('hidden');
  $('win').classList.add('hidden');
  $('game').classList.remove('hidden');
}

$('board').addEventListener('click',(e)=>{
  const card=e.target.closest('.mcard');
  if(!card || lock || card.classList.contains('flip')) return;
  audio(); sFlip();
  card.classList.add('flip');

  if(!first){ first=card; return; }

  moves++; $('moves').textContent=moves;
  const a=first, b=card; first=null;

  if(a.dataset.e===b.dataset.e){
    a.classList.add('matched'); b.classList.add('matched');
    matched++;
    sMatch();
    if(navigator.vibrate) navigator.vibrate(25);
    if(matched===LEVELS[level].pairs) setTimeout(win,650);
  } else {
    lock=true;
    setTimeout(()=>{
      sNo();
      a.classList.add('shake'); b.classList.add('shake');
      setTimeout(()=>{
        a.classList.remove('flip','shake'); b.classList.remove('flip','shake');
        lock=false;
      },380);
    },520);
  }
});

function win(){
  clearInterval(timer);
  sWin();
  if(navigator.vibrate) navigator.vibrate([40,60,40]);
  const pairs=LEVELS[level].pairs;
  const starCount = moves<=pairs*1.5 ? 3 : moves<=pairs*2.3 ? 2 : 1;
  $('stars').innerHTML='⭐'.repeat(starCount)+'<span class="dim">'+'⭐'.repeat(3-starCount)+'</span>';
  $('win-moves').textContent=moves;
  $('win-time').textContent=fmtTime(secs);

  const prev=best[level];
  const isBest=!prev || moves<prev.moves;
  if(isBest){ best[level]={moves,secs}; localStorage.setItem(BEST_KEY,JSON.stringify(best)); }
  $('new-best').classList.toggle('hidden',!isBest);

  // confetti
  const em=['🎉','✨','💗','⭐','🎊'];
  for(let i=0;i<26;i++){
    const c=document.createElement('span');
    c.className='confetti';
    c.textContent=em[i%em.length];
    c.style.left=(Math.random()*100)+'vw';
    c.style.animationDuration=(1.6+Math.random()*1.6)+'s';
    c.style.animationDelay=(Math.random()*.5)+'s';
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),3800);
  }
  $('win').classList.remove('hidden');
}

document.querySelectorAll('.level-btn').forEach(b=>b.addEventListener('click',()=>start(+b.dataset.level)));
$('back').addEventListener('click',()=>{ clearInterval(timer); $('game').classList.add('hidden'); $('menu').classList.remove('hidden'); showBest(); });
$('win-again').addEventListener('click',()=>start(level));
$('win-menu').addEventListener('click',()=>{ $('win').classList.add('hidden'); $('game').classList.add('hidden'); $('menu').classList.remove('hidden'); showBest(); });

showBest();
})();
</script>
</body>
</html>
